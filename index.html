<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เซอร์ไพรส์ ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,400;1,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #07030d;
    --plum: #1a0933;
    --violet: #7b2ff7;
    --magenta: #ff2e9a;
    --lavender: #d9baff;
    --rose: #ff75b5;
    --gold: #ffe57f;
    --ink: #f3e9ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--void);
    overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
    user-select: none;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ---------- Aurora background ---------- */
  .aurora {
    position: absolute;
    inset: -10%;
    z-index: 0;
    filter: blur(65px) saturate(140%) brightness(1);
    transition: filter 2.5s ease, opacity 2s ease, transform 2s cubic-bezier(0.25, 1, 0.5, 1);
    will-change: transform, filter;
  }
  
  .aurora.speeding {
    filter: blur(35px) saturate(220%) brightness(1.6);
    transform: scale(1.35) rotate(8deg);
  }

  .aurora.destination {
    filter: blur(50px) saturate(180%) brightness(1.25);
    transform: scale(1.1) rotate(0deg);
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    opacity: 0.55;
    mix-blend-mode: screen;
  }

  .blob1 {
    width: 65vmax; height: 65vmax;
    top: -20vmax; left: -15vmax;
    background: radial-gradient(circle, var(--violet), transparent 65%);
    animation: drift1 22s ease-in-out infinite;
    transition: all 2.5s ease;
  }

  .blob2 {
    width: 60vmax; height: 60vmax;
    bottom: -22vmax; right: -12vmax;
    background: radial-gradient(circle, var(--magenta), transparent 65%);
    animation: drift2 26s ease-in-out infinite;
    transition: all 2.5s ease;
  }

  .blob3 {
    width: 45vmax; height: 45vmax;
    top: 40%; left: 50%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, var(--plum), transparent 70%);
    animation: drift3 18s ease-in-out infinite;
    transition: all 2.5s ease;
  }

  /* Destination colors shift */
  .aurora.destination .blob1 {
    background: radial-gradient(circle, #ff2e9a, transparent 65%);
    width: 75vmax; height: 75vmax;
    opacity: 0.75;
  }
  .aurora.destination .blob2 {
    background: radial-gradient(circle, #7b2ff7, transparent 65%);
    width: 70vmax; height: 70vmax;
    opacity: 0.75;
  }
  .aurora.destination .blob3 {
    background: radial-gradient(circle, #ff75b5, transparent 70%);
    width: 60vmax; height: 60vmax;
    opacity: 0.65;
  }

  @keyframes drift1 {
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(6vmax, 8vmax) scale(1.15); }
  }
  @keyframes drift2 {
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-7vmax, -6vmax) scale(1.1); }
  }
  @keyframes drift3 {
    0%,100%{ transform: translate(-50%,-50%) scale(1); opacity:.4;}
    50%{ transform: translate(-50%,-55%) scale(1.25); opacity:.6;}
  }

  /* ---------- Speed lines overlay ---------- */
  .speed-lines {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 46, 154, 0.15) 80%, rgba(123, 47, 247, 0.3) 100%);
    transition: opacity 0.4s ease;
  }
  .stage.speeding .speed-lines {
    opacity: 1;
    animation: speed-pulse 0.15s infinite alternate;
  }
  @keyframes speed-pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.04); }
  }

  /* ---------- Canvas (Stars & Hyperspace Warp) ---------- */
  #space-canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* ---------- Heart Layer ---------- */
  .heart-layer {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }

  .floating-heart {
    position: absolute;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    line-height: 1;
    will-change: transform, opacity;
    filter: drop-shadow(0 0 12px var(--glow-color, rgba(255, 46, 154, 0.6)));
    opacity: 0;
    pointer-events: none;
    animation: float-up var(--dur, 3s) cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0s) forwards;
  }

  @keyframes float-up {
    0% {
      transform: translate3d(0, 0, 0) scale(0.2) rotate(0deg);
      opacity: 0;
    }
    15% {
      opacity: 1;
    }
    85% {
      opacity: 0.85;
    }
    100% {
      transform: translate3d(var(--drift-x, 0px), var(--drift-y, -300px), 0) scale(var(--scale, 1)) rotate(var(--rot, 0deg));
      opacity: 0;
    }
  }

  /* Heart burst explosion animation */
  .burst-heart {
    position: absolute;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    line-height: 1;
    will-change: transform, opacity;
    filter: drop-shadow(0 0 16px rgba(255, 117, 181, 0.8));
    animation: burst-fly var(--dur, 2s) cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
  }

  @keyframes burst-fly {
    0% {
      transform: translate3d(0, 0, 0) scale(0.1) rotate(0deg);
      opacity: 1;
    }
    60% {
      opacity: 1;
    }
    100% {
      transform: translate3d(var(--vx), var(--vy), 0) scale(var(--scale, 1.2)) rotate(var(--rot));
      opacity: 0;
    }
  }

  /* ---------- Shockwave ring ---------- */
  .shockwave {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--magenta);
    box-shadow: 0 0 30px var(--violet), inset 0 0 20px var(--magenta);
    pointer-events: none;
    z-index: 2;
    transform: translate(-50%, -50%) scale(1);
    animation: shockwave-expand 1.2s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
  }
  @keyframes shockwave-expand {
    0% {
      width: 10px; height: 10px;
      opacity: 1;
      border-width: 4px;
    }
    100% {
      width: 120vmax; height: 120vmax;
      opacity: 0;
      border-width: 1px;
    }
  }

  /* ---------- The seal / orb ---------- */
  .seal-wrap {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    cursor: pointer;
    transition: opacity .6s ease, transform .6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .seal-wrap:hover {
    transform: scale(1.05);
  }
  .seal-wrap:active {
    transform: scale(0.95);
  }
  .seal-wrap.hidden {
    opacity: 0;
    transform: scale(0.4) rotate(180deg);
    pointer-events: none;
  }

  .ring {
    position: relative;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(217,186,255,0.4);
    animation: pulse-ring 3s ease-out infinite;
  }
  .ring::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 1px solid rgba(255,46,154,0.45);
    animation: pulse-ring 3s ease-out infinite;
    animation-delay: .6s;
  }
  @keyframes pulse-ring {
    0%{ transform: scale(0.85); opacity: 0; }
    30%{ opacity: 1; }
    100%{ transform: scale(1.4); opacity: 0; }
  }

  .orb {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, var(--lavender) 25%, var(--violet) 55%, var(--magenta) 100%);
    box-shadow: 0 0 35px 6px rgba(123,47,247,0.65), 0 0 70px 14px rgba(255,46,154,0.35);
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100%{ transform: scale(1); box-shadow: 0 0 35px 6px rgba(123,47,247,0.65), 0 0 70px 14px rgba(255,46,154,0.35); }
    50%{ transform: scale(1.1); box-shadow: 0 0 50px 10px rgba(123,47,247,0.85), 0 0 90px 20px rgba(255,46,154,0.55); }
  }

  .seal-label {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--lavender);
    opacity: .85;
    text-shadow: 0 0 10px rgba(217,186,255,0.5);
  }

  /* ---------- Reveal card ---------- */
  .reveal {
    position: absolute;
    z-index: 3;
    max-width: 520px;
    width: min(88vw, 520px);
    text-align: center;
    padding: 38px 28px;
    opacity: 0;
    transform: translateY(30px) scale(0.9);
    transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    background: rgba(16, 8, 32, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(255, 46, 154, 0.15);
    overflow: hidden;
  }
  
  /* Faint watermark text inside the background card */
  .reveal::before {
    content: "I wasn't planning on this...";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-8deg) scale(1.6);
    font-family: 'Fraunces', serif;
    font-size: 46px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.05);
    white-space: nowrap;
    pointer-events: none;
    z-index: 0;
    letter-spacing: 2px;
    text-shadow: 0 0 25px rgba(255, 46, 154, 0.3);
  }

  .reveal.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  /* ---------- Profile Duo (High-Speed Dash / Running towards each other) ---------- */
  .profile-duo {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    margin: 14px auto 18px auto;
    width: fit-content;
  }

  #energy-bridge {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    height: 160px;
    pointer-events: none;
    z-index: 1;
  }

  .avatar-wrap {
    position: relative;
    z-index: 5;
    width: 105px;
    height: 105px;
    border-radius: 50%;
    padding: 4px;
    will-change: transform, opacity;
  }

  .avatar-left {
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    box-shadow: 0 0 25px rgba(0, 242, 254, 0.75);
    transform: translateX(-240px) scale(0.4) rotate(-25deg);
    opacity: 0;
  }

  .avatar-right {
    background: linear-gradient(135deg, var(--magenta), var(--rose));
    box-shadow: 0 0 25px rgba(255, 46, 154, 0.6);
    transform: translateX(240px) scale(0.4) rotate(25deg);
    opacity: 0;
  }

  /* High-speed running animation when card opens */
  .reveal.show .avatar-left {
    animation: run-in-left 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards, float-idle-left 3.5s ease-in-out 1.3s infinite alternate;
  }

  .reveal.show .avatar-right {
    animation: run-in-right 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards, float-idle-right 3.5s ease-in-out 1.3s infinite alternate;
  }

  @keyframes run-in-left {
    0% {
      transform: translateX(-240px) scale(0.4) rotate(-25deg);
      opacity: 0;
      filter: blur(8px);
      box-shadow: -20px 0 35px rgba(123, 47, 247, 0.9);
    }
    60% {
      transform: translateX(12px) scale(1.08) rotate(6deg);
      opacity: 1;
      filter: blur(0px);
      box-shadow: 0 0 35px rgba(123, 47, 247, 0.8);
    }
    82% {
      transform: translateX(-5px) scale(0.96) rotate(-2deg);
    }
    100% {
      transform: translateX(0) scale(1) rotate(0deg);
      opacity: 1;
      box-shadow: 0 0 25px rgba(123, 47, 247, 0.6);
    }
  }

  @keyframes run-in-right {
    0% {
      transform: translateX(240px) scale(0.4) rotate(25deg);
      opacity: 0;
      filter: blur(8px);
      box-shadow: 20px 0 35px rgba(255, 46, 154, 0.9);
    }
    60% {
      transform: translateX(-12px) scale(1.08) rotate(-6deg);
      opacity: 1;
      filter: blur(0px);
      box-shadow: 0 0 35px rgba(255, 46, 154, 0.8);
    }
    82% {
      transform: translateX(5px) scale(0.96) rotate(2deg);
    }
    100% {
      transform: translateX(0) scale(1) rotate(0deg);
      opacity: 1;
      box-shadow: 0 0 25px rgba(255, 46, 154, 0.6);
    }
  }

  @keyframes float-idle-left {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-7px) rotate(-3deg); }
  }
  @keyframes float-idle-right {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-7px) rotate(3deg); }
  }

  .avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #ffffff;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    filter: none !important;
    transform: translateZ(0);
  }

  .avatar-left .avatar-img {
    object-position: 65% 20%;
  }

  .avatar-right .avatar-img {
    object-position: center 30%;
  }

  .heart-center {
    position: absolute;
    z-index: 10;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff2e9a, #7b2ff7);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 22px rgba(255, 46, 154, 0.85), 0 0 40px rgba(123, 47, 247, 0.65);
    border: 2px solid #ffffff;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .reveal.show .heart-center {
    transform: translate(-50%, -50%) scale(1);
    transition-delay: 0.75s;
    animation: heart-impact-beat 1.6s ease-in-out infinite 1.3s;
  }

  @keyframes heart-impact-beat {
    0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 22px rgba(255, 46, 154, 0.85); }
    50% { transform: translate(-50%, -50%) scale(1.22); box-shadow: 0 0 38px rgba(255, 46, 154, 1), 0 0 55px rgba(123, 47, 247, 0.85); }
  }

  @keyframes heart-beat {
    0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 22px rgba(255, 46, 154, 0.85); }
    50% { transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 38px rgba(255, 46, 154, 1), 0 0 55px rgba(123, 47, 247, 0.85); }
  }

  .heart-icon {
    font-size: 22px;
    line-height: 1;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
  }

  .eyebrow {
    position: relative;
    z-index: 1;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--magenta);
    margin-bottom: 14px;
    opacity: .95;
    text-shadow: 0 0 12px rgba(255, 46, 154, 0.5);
  }

  .headline {
    position: relative;
    z-index: 1;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(24px, 5.5vw, 36px);
    line-height: 1.3;
    color: var(--ink);
    margin: 10px 0 26px 0;
    transform: scale(0.85);
    opacity: 0;
    transition: transform 1s cubic-bezier(.22, 1.5, .36, 1), opacity .8s ease;
  }
  .reveal.show .headline {
    transform: scale(1);
    opacity: 1;
  }
  .headline .accent {
    position: relative;
    display: inline-block;
    font-weight: 600;
    background: linear-gradient(100deg, #ffffff 0%, var(--lavender) 20%, var(--magenta) 45%, var(--violet) 70%, var(--rose) 100%);
    background-size: 260% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 4s linear infinite, glow-pulse 2.6s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%{ background-position: 0% 50%; }
    100%{ background-position: 200% 50%; }
  }
  @keyframes glow-pulse {
    0%,100%{ filter: drop-shadow(0 0 12px rgba(255,46,154,0.4)) drop-shadow(0 0 25px rgba(123,47,247,0.3)); }
    50%{ filter: drop-shadow(0 0 25px rgba(255,46,154,0.75)) drop-shadow(0 0 45px rgba(123,47,247,0.6)); }
  }

  .sub {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    color: rgba(243,233,255,0.75);
    margin: 0 auto 28px auto;
    max-width: 460px;
  }

  .again {
    position: relative;
    z-index: 1;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--ink);
    background: linear-gradient(135deg, rgba(255,46,154,0.25), rgba(123,47,247,0.35));
    border: 1px solid rgba(217,186,255,0.4);
    padding: 14px 32px;
    border-radius: 999px;
    cursor: pointer;
    opacity: .9;
    box-shadow: 0 4px 20px rgba(123,47,247,0.3);
    transition: all 0.3s ease;
  }
  .again:hover {
    opacity: 1;
    border-color: var(--magenta);
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 6px 28px rgba(255,46,154,0.5);
    background: linear-gradient(135deg, rgba(255,46,154,0.4), rgba(123,47,247,0.5));
  }

  /* ---------- Mobile Responsive Styles ---------- */
  @media (max-width: 600px) {
    .reveal {
      width: min(92vw, 420px);
      padding: 26px 18px;
      border-radius: 22px;
    }
    .reveal::before {
      font-size: 32px;
    }
    .profile-duo {
      gap: 16px;
      margin: 8px auto 14px auto;
    }
    .avatar-wrap {
      width: 86px;
      height: 86px;
      padding: 3px;
    }
    .avatar-left {
      margin: 0;
    }
    .avatar-right {
      margin: 0;
    }
    .heart-center {
      width: 32px;
      height: 32px;
      border-width: 2px;
    }
    .heart-icon {
      font-size: 18px;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .headline {
      font-size: clamp(26px, 7.5vw, 40px);
      margin: 8px 0 20px 0;
    }
    .again {
      padding: 12px 26px;
      font-size: 11px;
      letter-spacing: 2px;
    }
    .ring {
      width: 115px;
      height: 115px;
    }
    .orb {
      width: 68px;
      height: 68px;
    }
  }

  @media (max-height: 700px) {
    .reveal {
      padding: 18px 16px;
    }
    .avatar-wrap {
      width: 80px;
      height: 80px;
    }
    .headline {
      margin: 6px 0 14px 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob, .ring::before, .ring::after, .orb, .floating-heart {
      animation: none !important;
    }
  }
  /* Midnight / Couple Mode Styles */
  body.midnight-mode {
    --bg-dark: #2a0845;
    --bg-light: #6441a5;
    background: linear-gradient(135deg, #1f0b2e, #4a1c40);
  }

  body.midnight-mode .aurora .blob1 { background: radial-gradient(circle, rgba(255,215,0,0.6) 0%, rgba(255,215,0,0) 70%); }
  body.midnight-mode .aurora .blob2 { background: radial-gradient(circle, rgba(255,105,180,0.5) 0%, rgba(255,105,180,0) 70%); }
  body.midnight-mode .aurora .blob3 { background: radial-gradient(circle, rgba(255,182,193,0.5) 0%, rgba(255,182,193,0) 70%); }

  body.midnight-mode .reveal::before {
    content: "Kong & Kao";
    color: rgba(255, 215, 0, 0.05);
  }

  body.midnight-mode .reveal {
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 30px 60px rgba(255, 215, 0, 0.15), inset 0 0 0 1px rgba(255, 215, 0, 0.25);
  }

  body.midnight-mode .accent {
    background: linear-gradient(135deg, #ffd700, #ff69b4, #ffdf00);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
  }
  
  body.midnight-mode .avatar-left {
    background: linear-gradient(135deg, #ffd700, #ffdf00);
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.75);
  }
  body.midnight-mode .avatar-right {
    background: linear-gradient(135deg, #ff69b4, #ffb6c1);
    box-shadow: 0 0 25px rgba(255, 105, 180, 0.75);
  }

  /* Baccarat Slot Machine Reel Spin Container */
  .slot-container {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);

<script>
  // ---------- Sound Effects System (Web Audio API) ----------
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();

  function initAudio() {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Audio Visualizer setup
  let audioAnalyser = null;
  let audioSource = null;

  function connectAudioAnalyser(audioElement) {
    // If opening as local file (file://), do NOT route through WebAudio MediaElementSource
    // because Chrome/Edge silently mutes local media elements due to CORS security rules!
    if (window.location.protocol === 'file:') {
      console.log('Local file protocol detected: Playing audio directly to speakers.');
      return;
    }

    if (!audioAnalyser) {
      try {
        audioAnalyser = audioCtx.createAnalyser();
        audioAnalyser.fftSize = 256;
        audioAnalyser.smoothingTimeConstant = 0.8;
        audioSource = audioCtx.createMediaElementSource(audioElement);
        audioSource.connect(audioAnalyser);
        audioAnalyser.connect(audioCtx.destination);
      } catch (e) {
        console.warn('AudioSource connection:', e);
      }
    }
  }

  function showVisualizer() {
    const visualizerCanvas = document.getElementById('visualizer-canvas');
    if (!visualizerCanvas) return;
    visualizerCanvas.classList.add('active');
    startVisualizerDrawing();
  }

  function startVisualizerDrawing() {
    const visualizerCanvas = document.getElementById('visualizer-canvas');
    if (!visualizerCanvas || visualizerCanvas.dataset.started) return;
    visualizerCanvas.dataset.started = "true";
    const vizCtx = visualizerCanvas.getContext('2d');

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      visualizerCanvas.width = window.innerWidth;
      visualizerCanvas.height = 65;

      const bufferLength = audioAnalyser ? audioAnalyser.frequencyBinCount : 64;
      const dataArray = new Uint8Array(bufferLength);

      if (audioAnalyser) {
        audioAnalyser.getByteFrequencyData(dataArray);
      } else {
        // High-quality rhythmic simulation for local file playback
        const time = Date.now() / 120;
        const beat = Math.pow(Math.sin(time * 0.8), 6); // Pulsing kick beat
        for (let i = 0; i < bufferLength; i++) {
          const wave1 = Math.sin(time * 2 + i * 0.2) * 20 + 20;
          const wave2 = Math.cos(time * 1.2 - i * 0.15) * 15;
          const noise = Math.random() * 8;
          const bassBoost = i < 10 ? beat * 35 : 0;
          dataArray[i] = Math.min(255, Math.max(5, wave1 + wave2 + noise + bassBoost));
        }
      }

      vizCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);

      const totalLines = 64;
      const step = visualizerCanvas.width / totalLines;
      const MAX_BAR_H = 38;

      for (let i = 0; i < totalLines; i++) {
        const dataIdx = Math.floor((i / totalLines) * bufferLength);
        const val = dataArray[dataIdx] || 0;
        const boost = dataIdx < 8 ? 1.2 : (dataIdx > 30 ? 1.3 : 1.0);
        const lineH = Math.min(MAX_BAR_H, ((val * boost) / 255) * MAX_BAR_H + 3);

        const x = i * step + step / 2;
        const yStart = visualizerCanvas.height;
        const yEnd = yStart - lineH;

        vizCtx.beginPath();
        vizCtx.moveTo(x, yStart);
        vizCtx.lineTo(x, yEnd);

        // Pink to Deep Navy stroke gradient
        const grad = vizCtx.createLinearGradient(x, yStart, x, yEnd);
        grad.addColorStop(0, 'rgba(10, 17, 40, 0.2)');
        grad.addColorStop(0.5, 'rgba(255, 46, 154, 0.85)');
        grad.addColorStop(1, 'rgba(255, 117, 181, 1)');

        vizCtx.strokeStyle = grad;
        vizCtx.lineWidth = 2.5;
        vizCtx.lineCap = 'round';
        vizCtx.shadowBlur = 8;
        vizCtx.shadowColor = '#ff69b4';
        vizCtx.stroke();
      }

      // Continuous glowing pink wave line along top tips
      vizCtx.beginPath();
      for (let i = 0; i < totalLines; i++) {
        const dataIdx = Math.floor((i / totalLines) * bufferLength);
        const val = dataArray[dataIdx] || 0;
        const boost = dataIdx < 8 ? 1.2 : (dataIdx > 30 ? 1.3 : 1.0);
        const lineH = Math.min(MAX_BAR_H, ((val * boost) / 255) * MAX_BAR_H + 3);

        const x = i * step + step / 2;
        const y = visualizerCanvas.height - lineH;
        if (i === 0) vizCtx.moveTo(x, y);
        else {
          const prevIdx = Math.floor(((i - 1) / totalLines) * bufferLength);
          const prevVal = dataArray[prevIdx] || 0;
          const prevBoost = prevIdx < 8 ? 1.2 : (prevIdx > 30 ? 1.3 : 1.0);
          const prevY = visualizerCanvas.height - Math.min(MAX_BAR_H, ((prevVal * prevBoost) / 255) * MAX_BAR_H + 3);
          const prevX = (i - 1) * step + step / 2;
          const cpX = (prevX + x) / 2;
          vizCtx.quadraticCurveTo(cpX, prevY, x, y);
        }
      }
      vizCtx.strokeStyle = 'rgba(255, 117, 181, 0.95)';
      vizCtx.lineWidth = 2;
      vizCtx.shadowBlur = 10;
      vizCtx.shadowColor = '#ff69b4';
      vizCtx.stroke();
    }

    drawVisualizer();
  }

  // Make sure clicking anywhere activates the audio context
  window.addEventListener('click', initAudio, { once: true });

  function playCountdownTickSound() {
    if (audioCtx.state === 'suspended') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  function playUrgentTickSound() {
    if (audioCtx.state === 'suspended') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1500, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }

  function playTickSound() {
    if (audioCtx.state === 'suspended') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(3000, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.04);
    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.04);
  }

  function playDingSound() {
    if (audioCtx.state === 'suspended') return;
    const freqs = [1046.50, 1318.51, 1567.98]; // C6, E6, G6
    freqs.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2 + (i*0.2));
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.8);
    });
  }

  function playJackpotSound() {
    if (audioCtx.state === 'suspended') return;
    const duration = 3.5;
    const chord = [523.25, 659.25, 783.99, 1046.50]; // Epic C Major chord (C5, E5, G5, C6)
    
    // Create an epic pad with multiple oscillators
    chord.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = i % 2 === 0 ? 'sawtooth' : 'square';
      osc.frequency.value = freq;
      
      // Filter for sweeping effect
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(400, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(4000, audioCtx.currentTime + 0.8);
      
      // Envelopes
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    });

    // Add a deep sub impact (Sub-bass drop)
    const subOsc = audioCtx.createOscillator();
    const subGain = audioCtx.createGain();
    subOsc.type = 'sine';
    subOsc.frequency.setValueAtTime(100, audioCtx.currentTime);
    subOsc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 1.5);
    subGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    subGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.5);
    subOsc.connect(subGain);
    subGain.connect(audioCtx.destination);
    subOsc.start();
    subOsc.stop(audioCtx.currentTime + 2.5);
  }

  function playWhooshSound() {
    if (audioCtx.state === 'suspended') return;
    const dur = 1.0;
    const bufferSize = audioCtx.sampleRate * dur;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }
    const noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = noiseBuffer;
    
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.setValueAtTime(200, audioCtx.currentTime);
    noiseFilter.frequency.exponentialRampToValueAtTime(4000, audioCtx.currentTime + 0.5);
    noiseFilter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 1.0);
    
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0, audioCtx.currentTime);
    noiseGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.5);
    noiseGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);
    
    noiseSrc.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    noiseSrc.start();
  }

  function playMagicRevealSound() {
    if (audioCtx.state === 'suspended') return;
    
    const duration = 4.0;
    
    // 1. Clean Deep Sub Impact (No buzzing saw waves, just pure sine thump)
    const subOsc = audioCtx.createOscillator();
    const subGain = audioCtx.createGain();
    subOsc.type = 'sine';
    subOsc.frequency.setValueAtTime(80, audioCtx.currentTime);
    subOsc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 1.0);
    
    subGain.gain.setValueAtTime(0, audioCtx.currentTime);
    subGain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
    subGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
    
    subOsc.connect(subGain);
    subGain.connect(audioCtx.destination);
    subOsc.start();
    subOsc.stop(audioCtx.currentTime + 2.5);

    // 2. Ethereal Shimmering Chords (Magic Reveal)
    const chordFreqs = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5, E5, G5, C6, E6
    chordFreqs.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = i % 2 === 0 ? 'sine' : 'triangle';
      osc.frequency.value = freq;
      
      // Detune slightly for a chorus/shimmer effect
      osc.detune.value = (Math.random() - 0.5) * 20;
      
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      // Staggered attacks for a harp-like strum or swell
      gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.1 + (i * 0.1));
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    });

    // 3. High-frequency Air / Fairy Dust (High-pass Noise)
    const bufferSize = audioCtx.sampleRate * 2.0;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }
    const noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = noiseBuffer;
    
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.setValueAtTime(4000, audioCtx.currentTime); // Keep it very high, no bass
    
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0, audioCtx.currentTime);
    noiseGain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.2);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
    
    noiseSrc.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    noiseSrc.start();
  }

  const starColors = ['#ffffff', '#d9baff', '#ff2e9a', '#7b2ff7', '#ff75b5', '#ffe57f'];

  function initStars() {
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: (Math.random() - 0.5) * width * 2,
        y: (Math.random() - 0.5) * height * 2,
        z: Math.random() * width,
        pz: Math.random() * width,
        color: starColors[Math.floor(Math.random() * starColors.length)],
        size: 1 + Math.random() * 2
      });
    }
  }
  initStars();

  function renderStars() {
    ctx.clearRect(0, 0, width, height);

    // Smooth speed interpolation
    currentSpeed += (targetSpeed - currentSpeed) * 0.04;

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.pz = s.z;
      s.z -= currentSpeed * 12;

      // Reset star when it passes camera
      if (s.z <= 0) {
        s.z = width;
        s.pz = width;
        s.x = (Math.random() - 0.5) * width * 2;
        s.y = (Math.random() - 0.5) * height * 2;
      }

      // Projection to 2D
      const k = 300 / s.z;
      const px = s.x * k + cx;
      const py = s.y * k + cy;

      const pk = 300 / s.pz;
      const prevX = s.x * pk + cx;
      const prevY = s.y * pk + cy;

      if (px >= 0 && px <= width && py >= 0 && py <= height) {
        const alpha = Math.min(1, (1 - s.z / width) * 1.2);
        
        if (currentSpeed > 3) {
          // Draw warp speed streaks
          ctx.beginPath();
          ctx.moveTo(prevX, prevY);
          ctx.lineTo(px, py);
          ctx.strokeStyle = s.color;
          ctx.lineWidth = s.size * (currentSpeed / 6);
          ctx.globalAlpha = alpha;
          ctx.shadowBlur = 10;
          ctx.shadowColor = s.color;
          ctx.stroke();
        } else {
          // Draw peaceful twinkling dots
          const r = s.size * k * 0.5;
          ctx.beginPath();
          ctx.arc(px, py, Math.max(0.8, r), 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.globalAlpha = alpha * (0.4 + Math.sin(Date.now() * 0.003 + i) * 0.6);
          ctx.shadowBlur = 6;
          ctx.shadowColor = s.color;
          ctx.fill();
        }
      }
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    requestAnimationFrame(renderStars);
  }

  const CREEPY_SPARK_COUNT = 35;

  for (let i = 0; i < CREEPY_SPARK_COUNT; i++) {

  function renderEnergyBridge() {
    eCtx.clearRect(0, 0, eCanvas.width, eCanvas.height);

    if (!reveal.classList.contains('show')) {
      requestAnimationFrame(renderEnergyBridge);
      return;
    }

    const leftX = 110;
    const rightX = 230;
    const midX = (leftX + rightX) / 2;
    const centerY = 80;
    const time = Date.now() * 0.003;

    // Check if Midnight Mode is active
    const isMidnight = document.body.classList.contains('midnight-mode');

    if (isMidnight) {
      // Midnight Golden & Pink Romantic Energy Bridge
      eCtx.globalCompositeOperation = 'screen';
      const WAVE_COUNT = 5;
      for (let w = 0; w < WAVE_COUNT; w++) {
        eCtx.beginPath();
        eCtx.moveTo(leftX, centerY);

        const waveFreq = 2.2 + w * 0.4;
        const waveAmp = 8 + Math.sin(time * 0.9 + w) * 6;
        const waveShift = time * (1.1 + w * 0.25);

        for (let x = leftX; x <= rightX; x += 2) {
          const norm = (x - leftX) / (rightX - leftX);
          const envelope = Math.sin(norm * Math.PI);
          const y = centerY + Math.sin(norm * waveFreq * Math.PI + waveShift) * waveAmp * envelope;
          
          if (x === leftX) eCtx.moveTo(x, y);
          else eCtx.lineTo(x, y);
        }

        const alpha = 0.38 + Math.sin(time * 1.2 + w) * 0.16;
        const strokeGrad = eCtx.createLinearGradient(leftX, centerY, rightX, centerY);
        strokeGrad.addColorStop(0, `rgba(255, 105, 180, ${alpha * 0.85})`); // Romantic Pink
        strokeGrad.addColorStop(0.5, `rgba(123, 47, 247, ${alpha})`); // Deep Navy Violet
        strokeGrad.addColorStop(1, `rgba(255, 117, 181, ${alpha * 0.85})`); // Soft Pink

        eCtx.strokeStyle = strokeGrad;
        eCtx.lineWidth = 1.3 + Math.sin(time * 2.2 + w) * 0.6;

        let startPos = p.direction === 1 ? leftX : rightX;
        let targetPos = p.direction === 1 ? rightX : leftX;
        let px = startPos + (targetPos - startPos) * p.progress;

        const norm = (px - leftX) / (rightX - leftX);
        const envelope = Math.sin(norm * Math.PI);
        const py = centerY + Math.sin(time * 5 + p.offsetY) * p.offsetY * envelope;
        const alpha = Math.sin(norm * Math.PI) * (0.4 + Math.random() * 0.6);

        eCtx.beginPath();
        eCtx.arc(px, py, p.size, 0, Math.PI * 2);
        eCtx.fillStyle = '#fff';
        eCtx.globalAlpha = Math.max(0, alpha);
        eCtx.shadowBlur = 12;
        eCtx.shadowColor = '#ff69b4';

          const y = centerY + (wave1 + wave2 + jitter) * envelope;

          eCtx.lineTo(x, y);
        }
        eCtx.lineTo(rightX, centerY);

        const strokeGrad = eCtx.createLinearGradient(leftX, centerY, rightX, centerY);
        strokeGrad.addColorStop(0, 'rgba(136, 0, 0, 0.85)');
        strokeGrad.addColorStop(0.5, 'rgba(255, 0, 51, 0.95)');
        strokeGrad.addColorStop(1, 'rgba(30, 0, 20, 0.85)');

        eCtx.strokeStyle = strokeGrad;
        eCtx.lineWidth = 1.2 + (t % 3) * 0.8;
        eCtx.shadowBlur = 16;
        eCtx.shadowColor = '#ff0033';
        eCtx.stroke();

      }
    }, 5000);

    // PHASE 2 (700ms): Morph theme & trigger Baccarat Slot animation
    setTimeout(() => {
      document.body.classList.add('midnight-mode');
      const auroraElem = document.getElementById('aurora');
      if (auroraElem) auroraElem.style.filter = 'none';

      // Supernova fades out as Slot Machine Reel appears
      midnightSupernova.classList.add('fade-out');

      // Run Baccarat Slot spinning -> 5-sec flight -> Fly into top Pill box
      runSlotBaccaratAnimation(() => {
        // Morph headline text after pill badge lands
        headlineText.style.transition = 'all 1.2s cubic-bezier(0.16, 1, 0.3, 1)';
        headlineText.style.opacity = '0';
        headlineText.style.transform = 'scale(0.8)';
        
        setTimeout(() => {
          headlineText.innerHTML = '<span class="accent">Happy Anniversary! Kong & Kao, officially together. I love you.</span>';
          headlineText.style.opacity = '1';
          headlineText.style.transform = 'scale(1)';
        }, 400);

        // Reveal Audio Wave Visualizer lines AFTER date finishes flying into top pill badge!
        setTimeout(() => {
          showVisualizer();
        }, 600);
      });
    }, 700);

    // 3. Start background color morph smoothly right after music starts (at 5.5s)
    // with a super slow 8-second transition so it evolves organically without any sudden shift!
    setTimeout(() => {
      document.body.classList.add('warm-melancholy');
    }, 5500);

    // PHASE 3 (2200ms): Ease warp speed
    setTimeout(() => {
      targetSpeed = 0.5;
      midnightSupernova.className = 'midnight-supernova';
    }, 2200);
  }

  // Start countdown
  countdownInterval = setInterval(updateCountdown, 1000);
  updateCountdown();

  // Initialize Scene on load
  window.addEventListener('DOMContentLoaded', initScene);
</script>
