<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เซอร์ไพรส์ ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,400;1,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #07030d;
    --plum: #1a0933;
    --violet: #7b2ff7;
    --magenta: #ff2e9a;
    --lavender: #d9baff;
    --rose: #ff75b5;
    --gold: #ffe57f;
    --ink: #f3e9ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--void);
    overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
    user-select: none;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ---------- Aurora background ---------- */
  .aurora {
    position: absolute;
    inset: -10%;
    z-index: 0;
    filter: blur(65px) saturate(140%) brightness(1);
    transition: filter 2.5s ease, opacity 2s ease, transform 2s cubic-bezier(0.25, 1, 0.5, 1);
    will-change: transform, filter;
  }
  
  .aurora.speeding {
    filter: blur(35px) saturate(220%) brightness(1.6);
    transform: scale(1.35) rotate(8deg);
  }

  .aurora.destination {
    filter: blur(50px) saturate(180%) brightness(1.25);
    transform: scale(1.1) rotate(0deg);
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    opacity: 0.55;
    mix-blend-mode: screen;
  }

  .blob1 {
    width: 65vmax; height: 65vmax;
    top: -20vmax; left: -15vmax;
    background: radial-gradient(circle, var(--violet), transparent 65%);
    animation: drift1 22s ease-in-out infinite;
    transition: all 2.5s ease;
  }

  .blob2 {
    width: 60vmax; height: 60vmax;
    bottom: -22vmax; right: -12vmax;
    background: radial-gradient(circle, var(--magenta), transparent 65%);
    animation: drift2 26s ease-in-out infinite;
    transition: all 2.5s ease;
  }

  .blob3 {
    width: 45vmax; height: 45vmax;
    top: 40%; left: 50%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, var(--plum), transparent 70%);
    animation: drift3 18s ease-in-out infinite;
    transition: all 2.5s ease;
  }

  /* Destination colors shift */
  .aurora.destination .blob1 {
    background: radial-gradient(circle, #ff2e9a, transparent 65%);
    width: 75vmax; height: 75vmax;
    opacity: 0.75;
  }
  .aurora.destination .blob2 {
    background: radial-gradient(circle, #7b2ff7, transparent 65%);
    width: 70vmax; height: 70vmax;
    opacity: 0.75;
  }
  .aurora.destination .blob3 {
    background: radial-gradient(circle, #ff75b5, transparent 70%);
    width: 60vmax; height: 60vmax;
    opacity: 0.65;
  }

  @keyframes drift1 {
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(6vmax, 8vmax) scale(1.15); }
  }
  @keyframes drift2 {
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-7vmax, -6vmax) scale(1.1); }
  }
  @keyframes drift3 {
    0%,100%{ transform: translate(-50%,-50%) scale(1); opacity:.4;}
    50%{ transform: translate(-50%,-55%) scale(1.25); opacity:.6;}
  }

  /* ---------- Speed lines overlay ---------- */
  .speed-lines {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 46, 154, 0.15) 80%, rgba(123, 47, 247, 0.3) 100%);
    transition: opacity 0.4s ease;
  }
  .stage.speeding .speed-lines {
    opacity: 1;
    animation: speed-pulse 0.15s infinite alternate;
  }
  @keyframes speed-pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.04); }
  }

  /* ---------- Canvas (Stars & Hyperspace Warp) ---------- */
  #space-canvas {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* ---------- Heart Layer ---------- */
  .heart-layer {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }

  .floating-heart {
    position: absolute;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    line-height: 1;
    will-change: transform, opacity;
    filter: drop-shadow(0 0 12px var(--glow-color, rgba(255, 46, 154, 0.6)));
    opacity: 0;
    pointer-events: none;
    animation: float-up var(--dur, 3s) cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0s) forwards;
  }

  @keyframes float-up {
    0% {
      transform: translate3d(0, 0, 0) scale(0.2) rotate(0deg);
      opacity: 0;
    }
    15% {
      opacity: 1;
    }
    85% {
      opacity: 0.85;
    }
    100% {
      transform: translate3d(var(--drift-x, 0px), var(--drift-y, -300px), 0) scale(var(--scale, 1)) rotate(var(--rot, 0deg));
      opacity: 0;
    }
  }

  /* Heart burst explosion animation */
  .burst-heart {
    position: absolute;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    line-height: 1;
    will-change: transform, opacity;
    filter: drop-shadow(0 0 16px rgba(255, 117, 181, 0.8));
    animation: burst-fly var(--dur, 2s) cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
  }

  @keyframes burst-fly {
    0% {
      transform: translate3d(0, 0, 0) scale(0.1) rotate(0deg);
      opacity: 1;
    }
    60% {
      opacity: 1;
    }
    100% {
      transform: translate3d(var(--vx), var(--vy), 0) scale(var(--scale, 1.2)) rotate(var(--rot));
      opacity: 0;
    }
  }

  /* ---------- Shockwave ring ---------- */
  .shockwave {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--magenta);
    box-shadow: 0 0 30px var(--violet), inset 0 0 20px var(--magenta);
    pointer-events: none;
    z-index: 2;
    transform: translate(-50%, -50%) scale(1);
    animation: shockwave-expand 1.2s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
  }
  @keyframes shockwave-expand {
    0% {
      width: 10px; height: 10px;
      opacity: 1;
      border-width: 4px;
    }
    100% {
      width: 120vmax; height: 120vmax;
      opacity: 0;
      border-width: 1px;
    }
  }

  /* ---------- The seal / orb ---------- */
  .seal-wrap {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    cursor: pointer;
    transition: opacity .6s ease, transform .6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .seal-wrap:hover {
    transform: scale(1.05);
  }
  .seal-wrap:active {
    transform: scale(0.95);
  }
  .seal-wrap.hidden {
    opacity: 0;
    transform: scale(0.4) rotate(180deg);
    pointer-events: none;
  }

  .ring {
    position: relative;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(217,186,255,0.4);
    animation: pulse-ring 3s ease-out infinite;
  }
  .ring::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 1px solid rgba(255,46,154,0.45);
    animation: pulse-ring 3s ease-out infinite;
    animation-delay: .6s;
  }
  @keyframes pulse-ring {
    0%{ transform: scale(0.85); opacity: 0; }
    30%{ opacity: 1; }
    100%{ transform: scale(1.4); opacity: 0; }
  }

  .orb {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, var(--lavender) 25%, var(--violet) 55%, var(--magenta) 100%);
    box-shadow: 0 0 35px 6px rgba(123,47,247,0.65), 0 0 70px 14px rgba(255,46,154,0.35);
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100%{ transform: scale(1); box-shadow: 0 0 35px 6px rgba(123,47,247,0.65), 0 0 70px 14px rgba(255,46,154,0.35); }
    50%{ transform: scale(1.1); box-shadow: 0 0 50px 10px rgba(123,47,247,0.85), 0 0 90px 20px rgba(255,46,154,0.55); }
  }

  .seal-label {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--lavender);
    opacity: .85;
    text-shadow: 0 0 10px rgba(217,186,255,0.5);
  }

  /* ---------- Reveal card ---------- */
  .reveal {
    position: absolute;
    z-index: 3;
    max-width: 520px;
    width: min(88vw, 520px);
    text-align: center;
    padding: 38px 28px;
    opacity: 0;
    transform: translateY(30px) scale(0.9);
    transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    background: rgba(16, 8, 32, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(255, 46, 154, 0.15);
    overflow: hidden;
  }
  
  /* Faint watermark text inside the background card */
  .reveal::before {
    content: "ก้องรักเก้าที่สุดด";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-8deg) scale(1.6);
    font-family: 'Fraunces', serif;
    font-size: 46px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.05);
    white-space: nowrap;
    pointer-events: none;
    z-index: 0;
    letter-spacing: 2px;
    text-shadow: 0 0 25px rgba(255, 46, 154, 0.3);
  }

  .reveal.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  /* ---------- Profile Duo (Avatars separated + Heart in Gap) ---------- */
  .profile-duo {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin: 12px auto 16px auto;
    width: fit-content;
  }

  .avatar-wrap {
    position: relative;
    width: 105px;
    height: 105px;
    border-radius: 50%;
    padding: 4px;
    transition: transform 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease;
  }

  .avatar-left {
    background: linear-gradient(135deg, var(--violet), var(--lavender));
    box-shadow: 0 0 25px rgba(123, 47, 247, 0.6);
    margin: 0;
    transform: translateX(-40px) rotate(-15deg);
    opacity: 0;
  }

  .avatar-right {
    background: linear-gradient(135deg, var(--magenta), var(--rose));
    box-shadow: 0 0 25px rgba(255, 46, 154, 0.6);
    margin: 0;
    transform: translateX(40px) rotate(15deg);
    opacity: 0;
  }

  .reveal.show .avatar-left {
    transform: translateX(0) rotate(0deg);
    opacity: 1;
    transition-delay: 0.15s;
  }

  .reveal.show .avatar-right {
    transform: translateX(0) rotate(0deg);
    opacity: 1;
    transition-delay: 0.15s;
  }

  .avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #ffffff;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
  }

  .avatar-left .avatar-img {
    object-position: 65% 20%;
  }

  .avatar-right .avatar-img {
    object-position: center 30%;
  }

  .heart-center {
    position: absolute;
    z-index: 10;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff2e9a, #7b2ff7);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 22px rgba(255, 46, 154, 0.85), 0 0 40px rgba(123, 47, 247, 0.65);
    border: 2px solid #ffffff;
    transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .reveal.show .heart-center {
    transform: translate(-50%, -50%) scale(1);
    transition-delay: 0.45s;
    animation: heart-beat 1.6s ease-in-out infinite 0.9s;
  }

  @keyframes heart-beat {
    0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 22px rgba(255, 46, 154, 0.85); }
    50% { transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 38px rgba(255, 46, 154, 1), 0 0 55px rgba(123, 47, 247, 0.85); }
  }

  .heart-icon {
    font-size: 22px;
    line-height: 1;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
  }

  .eyebrow {
    position: relative;
    z-index: 1;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--magenta);
    margin-bottom: 14px;
    opacity: .95;
    text-shadow: 0 0 12px rgba(255, 46, 154, 0.5);
  }

  .headline {
    position: relative;
    z-index: 1;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(38px, 8vw, 56px);
    line-height: 1.3;
    color: var(--ink);
    margin: 10px 0 26px 0;
    transform: scale(0.85);
    opacity: 0;
    transition: transform 1s cubic-bezier(.22, 1.5, .36, 1), opacity .8s ease;
  }
  .reveal.show .headline {
    transform: scale(1);
    opacity: 1;
  }
  .headline .accent {
    position: relative;
    display: inline-block;
    font-weight: 600;
    background: linear-gradient(100deg, #ffffff 0%, var(--lavender) 20%, var(--magenta) 45%, var(--violet) 70%, var(--rose) 100%);
    background-size: 260% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 4s linear infinite, glow-pulse 2.6s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%{ background-position: 0% 50%; }
    100%{ background-position: 200% 50%; }
  }
  @keyframes glow-pulse {
    0%,100%{ filter: drop-shadow(0 0 12px rgba(255,46,154,0.4)) drop-shadow(0 0 25px rgba(123,47,247,0.3)); }
    50%{ filter: drop-shadow(0 0 25px rgba(255,46,154,0.75)) drop-shadow(0 0 45px rgba(123,47,247,0.6)); }
  }

  .sub {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    color: rgba(243,233,255,0.75);
    margin: 0 auto 28px auto;
    max-width: 460px;
  }

  .again {
    position: relative;
    z-index: 1;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--ink);
    background: linear-gradient(135deg, rgba(255,46,154,0.25), rgba(123,47,247,0.35));
    border: 1px solid rgba(217,186,255,0.4);
    padding: 14px 32px;
    border-radius: 999px;
    cursor: pointer;
    opacity: .9;
    box-shadow: 0 4px 20px rgba(123,47,247,0.3);
    transition: all 0.3s ease;
  }
  .again:hover {
    opacity: 1;
    border-color: var(--magenta);
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 6px 28px rgba(255,46,154,0.5);
    background: linear-gradient(135deg, rgba(255,46,154,0.4), rgba(123,47,247,0.5));
  }

  /* ---------- Mobile Responsive Styles ---------- */
  @media (max-width: 600px) {
    .reveal {
      width: min(92vw, 420px);
      padding: 26px 18px;
      border-radius: 22px;
    }
    .reveal::before {
      font-size: 32px;
    }
    .profile-duo {
      gap: 16px;
      margin: 8px auto 14px auto;
    }
    .avatar-wrap {
      width: 86px;
      height: 86px;
      padding: 3px;
    }
    .avatar-left {
      margin: 0;
    }
    .avatar-right {
      margin: 0;
    }
    .heart-center {
      width: 32px;
      height: 32px;
      border-width: 2px;
    }
    .heart-icon {
      font-size: 18px;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .headline {
      font-size: clamp(26px, 7.5vw, 40px);
      margin: 8px 0 20px 0;
    }
    .again {
      padding: 12px 26px;
      font-size: 11px;
      letter-spacing: 2px;
    }
    .ring {
      width: 115px;
      height: 115px;
    }
    .orb {
      width: 68px;
      height: 68px;
    }
  }

  @media (max-height: 700px) {
    .reveal {
      padding: 18px 16px;
    }
    .avatar-wrap {
      width: 80px;
      height: 80px;
    }
    .headline {
      margin: 6px 0 14px 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob, .ring::before, .ring::after, .orb, .floating-heart {
      animation: none !important;
    }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="aurora" id="aurora">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <div class="speed-lines"></div>
  <canvas id="space-canvas"></canvas>
  <div class="heart-layer" id="heart-layer"></div>

  <div class="seal-wrap" id="seal">
    <div class="ring"><div class="orb"></div></div>
    <div class="seal-label">แตะเพื่อเปิด</div>
  </div>

  <div class="reveal" id="reveal">
    <div class="eyebrow">✨ ข้อความลับ ✨</div>
    <div class="profile-duo">
      <div class="avatar-wrap avatar-left">
        <img src="kong.jpg" alt="ก้อง" class="avatar-img">
      </div>
      <div class="heart-center">
        <span class="heart-icon">💖</span>
      </div>
      <div class="avatar-wrap avatar-right">
        <img src="kao.jpg" alt="เก้า" class="avatar-img">
      </div>
    </div>
    <h1 class="headline"><span class="accent">ก้องรักเก้าที่สุดด</span></h1>
    <button class="again" id="again">เปิดอีกครั้ง 💖</button>
  </div>
</div>

<script>
  // ---------- 3D Hyperspace Warp Canvas ----------
  const canvas = document.getElementById('space-canvas');
  const ctx = canvas.getContext('2d');

  let width = window.innerWidth;
  let height = window.innerHeight;
  let cx = width / 2;
  let cy = height / 2;

  function resizeCanvas() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    cx = width / 2;
    cy = height / 2;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const STAR_COUNT = 350;
  let stars = [];
  
  // Speed control
  let currentSpeed = 0.8;
  let targetSpeed = 0.8;
  let isWarping = false;

  const starColors = ['#ffffff', '#d9baff', '#ff2e9a', '#7b2ff7', '#ff75b5', '#ffe57f'];

  function initStars() {
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: (Math.random() - 0.5) * width * 2,
        y: (Math.random() - 0.5) * height * 2,
        z: Math.random() * width,
        pz: Math.random() * width,
        color: starColors[Math.floor(Math.random() * starColors.length)],
        size: 1 + Math.random() * 2
      });
    }
  }
  initStars();

  function renderStars() {
    ctx.clearRect(0, 0, width, height);

    // Smooth speed interpolation
    currentSpeed += (targetSpeed - currentSpeed) * 0.04;

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.pz = s.z;
      s.z -= currentSpeed * 12;

      // Reset star when it passes camera
      if (s.z <= 0) {
        s.z = width;
        s.pz = width;
        s.x = (Math.random() - 0.5) * width * 2;
        s.y = (Math.random() - 0.5) * height * 2;
      }

      // Projection to 2D
      const k = 300 / s.z;
      const px = s.x * k + cx;
      const py = s.y * k + cy;

      const pk = 300 / s.pz;
      const prevX = s.x * pk + cx;
      const prevY = s.y * pk + cy;

      if (px >= 0 && px <= width && py >= 0 && py <= height) {
        const alpha = Math.min(1, (1 - s.z / width) * 1.2);
        
        if (currentSpeed > 3) {
          // Draw warp speed streaks
          ctx.beginPath();
          ctx.moveTo(prevX, prevY);
          ctx.lineTo(px, py);
          ctx.strokeStyle = s.color;
          ctx.lineWidth = s.size * (currentSpeed / 6);
          ctx.globalAlpha = alpha;
          ctx.shadowBlur = 10;
          ctx.shadowColor = s.color;
          ctx.stroke();
        } else {
          // Draw peaceful twinkling dots
          const r = s.size * k * 0.5;
          ctx.beginPath();
          ctx.arc(px, py, Math.max(0.8, r), 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.globalAlpha = alpha * (0.4 + Math.sin(Date.now() * 0.003 + i) * 0.6);
          ctx.shadowBlur = 6;
          ctx.shadowColor = s.color;
          ctx.fill();
        }
      }
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    requestAnimationFrame(renderStars);
  }
  requestAnimationFrame(renderStars);

  // ---------- Heart & Particles System ----------
  const heartLayer = document.getElementById('heart-layer');
  const heartIcons = ['💖', '💕', '💓', '💗', '💖', '💘', '✨', '🌸', '♥', '❣', '💌'];
  const colors = ['#d9baff', '#ff2e9a', '#7b2ff7', '#ff75b5', '#ffe57f', '#ffffff'];

  let rainInterval = null;

  function spawnShockwave(x, y) {
    const sw = document.createElement('div');
    sw.className = 'shockwave';
    sw.style.left = `${x}px`;
    sw.style.top = `${y}px`;
    document.body.appendChild(sw);
    setTimeout(() => sw.remove(), 1250);
  }

  // 1. Radial Burst of Hearts when seal clicked
  function spawnHeartBurst(originX, originY) {
    const burstCount = 65;
    for (let i = 0; i < burstCount; i++) {
      const heart = document.createElement('div');
      heart.className = 'burst-heart';
      heart.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];

      const angle = Math.random() * Math.PI * 2;
      const distance = 150 + Math.random() * (Math.max(width, height) * 0.6);
      const vx = Math.cos(angle) * distance;
      const vy = Math.sin(angle) * distance;
      const rot = (Math.random() - 0.5) * 360;
      const scale = 0.8 + Math.random() * 1.5;
      const dur = 1.4 + Math.random() * 1.2;

      heart.style.left = `${originX}px`;
      heart.style.top = `${originY}px`;
      heart.style.fontSize = `${16 + Math.random() * 24}px`;
      heart.style.setProperty('--vx', `${vx}px`);
      heart.style.setProperty('--vy', `${vy}px`);
      heart.style.setProperty('--rot', `${rot}deg`);
      heart.style.setProperty('--scale', `${scale}`);
      heart.style.setProperty('--dur', `${dur}s`);

      heartLayer.appendChild(heart);
      setTimeout(() => heart.remove(), dur * 1000);
    }
  }

  // 2. Continuous floating romantic hearts stream
  function spawnFloatingHeart() {
    const heart = document.createElement('div');
    heart.className = 'floating-heart';
    heart.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];

    const startX = Math.random() * width;
    const startY = height + 40;
    const driftX = (Math.random() - 0.5) * 260;
    const driftY = -(height * 0.7 + Math.random() * (height * 0.4));
    const size = 16 + Math.random() * 28;
    const glow = colors[Math.floor(Math.random() * colors.length)];
    const dur = 3 + Math.random() * 3.5;
    const delay = Math.random() * 0.3;

    heart.style.left = `${startX}px`;
    heart.style.top = `${startY}px`;
    heart.style.fontSize = `${size}px`;
    heart.style.setProperty('--glow-color', glow);
    heart.style.setProperty('--drift-x', `${driftX}px`);
    heart.style.setProperty('--drift-y', `${driftY}px`);
    heart.style.setProperty('--rot', `${(Math.random() - 0.5) * 180}deg`);
    heart.style.setProperty('--scale', `${0.6 + Math.random() * 0.8}`);
    heart.style.setProperty('--dur', `${dur}s`);
    heart.style.setProperty('--delay', `${delay}s`);

    heartLayer.appendChild(heart);
    setTimeout(() => heart.remove(), (dur + delay) * 1000);
  }

  function startHeartRain() {
    if (rainInterval) clearInterval(rainInterval);
    // Burst initial wave
    for (let i = 0; i < 20; i++) {
      setTimeout(spawnFloatingHeart, i * 80);
    }
    // Continuous ambient rain
    rainInterval = setInterval(spawnFloatingHeart, 220);
  }

  function stopHeartRain() {
    if (rainInterval) {
      clearInterval(rainInterval);
      rainInterval = null;
    }
  }

  // ---------- Interactive Sequence ----------
  const stage = document.getElementById('stage');
  const seal = document.getElementById('seal');
  const reveal = document.getElementById('reveal');
  const aurora = document.getElementById('aurora');
  const againBtn = document.getElementById('again');

  function openSurprise() {
    const rect = seal.getBoundingClientRect();
    const originX = rect.left + rect.width / 2;
    const originY = rect.top + rect.height / 2;

    // 1. Trigger shockwave & burst of hearts
    spawnShockwave(originX, originY);
    spawnHeartBurst(originX, originY);

    // 2. Hide orb seal
    seal.classList.add('hidden');

    // 3. PHASE 1: Warp Speed (Hyperspace travel)
    stage.classList.add('speeding');
    aurora.classList.add('speeding');
    aurora.classList.remove('destination');
    targetSpeed = 42; // High-speed star trails

    // Launch continuous floating hearts
    startHeartRain();

    // 4. PHASE 2: Decelerate & Arrive at Destination
    setTimeout(() => {
      // Speed slows down smoothly to a gentle halt
      targetSpeed = 0.5;
      stage.classList.remove('speeding');
      aurora.classList.remove('speeding');
      aurora.classList.add('destination');
    }, 1800);

    // 5. PHASE 3: Reveal Message after arriving at destination
    setTimeout(() => {
      reveal.classList.add('show');
    }, 2400);
  }

  function resetSurprise() {
    reveal.classList.remove('show');
    aurora.classList.remove('destination');
    aurora.classList.remove('speeding');
    stage.classList.remove('speeding');
    
    stopHeartRain();
    heartLayer.innerHTML = '';
    targetSpeed = 0.8;

    setTimeout(() => {
      seal.classList.remove('hidden');
    }, 600);
  }

  seal.addEventListener('click', openSurprise);
  againBtn.addEventListener('click', resetSurprise);

  // Click anywhere to spawn extra floating hearts after reveal
  document.addEventListener('click', (e) => {
    if (reveal.classList.contains('show') && !againBtn.contains(e.target)) {
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.className = 'burst-heart';
          heart.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];
          const angle = Math.random() * Math.PI * 2;
          const dist = 60 + Math.random() * 120;
          
          heart.style.left = `${e.clientX}px`;
          heart.style.top = `${e.clientY}px`;
          heart.style.fontSize = `${16 + Math.random() * 18}px`;
          heart.style.setProperty('--vx', `${Math.cos(angle) * dist}px`);
          heart.style.setProperty('--vy', `${Math.sin(angle) * dist}px`);
          heart.style.setProperty('--rot', `${(Math.random() - 0.5) * 180}deg`);
          heart.style.setProperty('--scale', '1');
          heart.style.setProperty('--dur', '1.2s');

          heartLayer.appendChild(heart);
          setTimeout(() => heart.remove(), 1200);
        }, i * 50);
      }
    }
  });
</script>

</body>
</html>
